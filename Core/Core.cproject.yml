# A project translates into one executable or library.
project:
  add-path:
    - ./inc

  # ERROR
  setups:
    - setup: Options for STM32CubeMX
      misc:
        - C-CPP:
            - '@./compiler_args.txt'

  # WORKS
  # misc:
  #   - C-CPP:
  #       - '@./compiler_args.txt'

  groups:
    - group: Source Files
      files:
        - file: ./main.c
      add-path:
        - ./inc

  # List components to use for your application.
  # A software component is a re-usable unit that may be configurable.
  components:
    - component: ARM::CMSIS:CORE
    - component: Device:CubeMX
    - component: MyCompany::Utility:Params

  layers:
    - layer: ../Shared/Shared.clayer.yml

  # List executable file formats to be generated.
  output:
    type:
      - elf
      - hex
      - map
